<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BP - Blockly Playground</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/gh/google/code-prettify@master/loader/run_prettify.js"></script>
    <script src="./lib/blockly_compressed.js"></script>
    <script src="./lib/blocks_compressed.js"></script>
    <script src="./lib/javascript_compressed.js"></script>
    <script src="./lib/python_compressed.js"></script>
    <script src="./lib/php_compressed.js"></script>
    <script src="./lib/lua_compressed.js"></script>
    <script src="./lib/dart_compressed.js"></script>
    <script src="./lib/msg/en.js"></script>
    <script src="./keyboard-navigation/index.js"></script>
    <script src="./js/Toolbox.js"></script>
    <script src="./js/key_overlay.js"></script>
    <script type="module" src="./js/instructions_overlay.js"></script>
    <script src="./js/main.js"></script>
</head>
<body>
  <div id="root">
    <nav class="navbar">
        <div class="logo">
            <img src="blockly.png" class="logo" alt="Blockly Logo">
            <h1>EAF Blockly Prototype</h1>
        </div>
    </nav>
    <main class="editor-region" aria-label="Blockly editor">
      <div class="editor-row">
        <!-- Heading for screen-reader heading navigation. The canvas below is a
             role="application" region; this off-screen h2 gives heading-nav users
             a jump target for it without altering the visual layout. -->
        <h2 class="sr-only">Workspace</h2>
        <div id="blocklyApp"
             role="application"
             tabindex="0"
             aria-label="Blockly workspace"
             style="flex:2; position:relative;">
            <div id="blocklyDiv" class="editor-panel"></div>
        </div>
        <div id="blockReader"
             class="visually-hidden"
             aria-live="assertive"
             aria-atomic="true"
             role="status"></div>
        <div class="execution-panel">
            <!-- Header row: Run + program picker + shortcuts -->
            <div class="exec-header" role="group">
                <button id="runButton" class="run-button" data-run>
                    Run <i class="fas fa-play-circle"></i>
                </button>

                <!-- Consolidated menu: Modes, Keyboard tutorial, settings.
                     Navigated with W/S (up/down), D (open submenu), A (back),
                     Enter (select), Escape (close). See app-menu.js. -->
                <div class="app-menu" id="appMenu">
                    <button id="appMenuTrigger" class="menu-button"
                            aria-haspopup="true" aria-expanded="false" aria-controls="appMenuPanel"
                            title="Menu"
                            aria-label="Open menu with modes, keyboard tutorial, and settings">
                        <i class="fas fa-bars" aria-hidden="true"></i>
                        <span class="sr-only">Menu</span>
                    </button>
                    <div id="appMenuPanel" class="menu-panel" hidden role="group" aria-label="Main menu">
                        <div class="menu-row">
                            <button type="button" class="menu-item" data-submenu="modesSubmenu"
                                    aria-haspopup="true" aria-expanded="false" aria-controls="modesSubmenu">
                                <span class="menu-item__label">Modes</span>
                                <span class="menu-item__chev" aria-hidden="true">›</span>
                            </button>
                            <div id="modesSubmenu" class="submenu" hidden role="group" aria-label="Modes">
                                <button type="button" class="menu-item" data-mode="beginner">
                                    <span class="menu-item__label">Beginner</span>
                                </button>
                                <button type="button" class="menu-item" data-mode="intermediate">
                                    <span class="menu-item__label">Intermediate</span>
                                </button>
                            </div>
                        </div>
                        <div class="menu-row">
                            <button type="button" class="menu-item" id="menuKeyboardTutorial">
                                <span class="menu-item__label">Keyboard tutorial</span>
                            </button>
                        </div>
                        <div class="menu-row">
                            <button type="button" class="menu-item" data-setting="screen">
                                <span class="menu-item__label">Screen settings</span>
                            </button>
                        </div>
                        <div class="menu-row">
                            <button type="button" class="menu-item" data-setting="sound">
                                <span class="menu-item__label">Sound settings</span>
                            </button>
                        </div>
                    </div>
                </div>

                <label class="sr-only" for="programSelect">Choose a program</label>
                <select id="programSelect" class="program-dropdown">
                    <option value="">None — select a program…</option>
                    <!-- options filled on events -->
                </select>
                <button id="showShortcuts" class="shortcut-button" title="Show keyboard shortcuts" aria-label="Show keyboard shortcuts">
                    <i class="fas fa-keyboard"></i>
                </button>
                <button id="showInstructions" class="info-button" title="Show task instructions" aria-label="Show task instructions">
                    <i class="fas fa-circle-info"></i>
                </button>
            </div>

            <!-- Output panel -->
            <section class="output-container">
                <div class="output-header">
                    <h2>Output</h2>
                </div>
                <div id="outputPanel" class="output-content" data-output="line" aria-describedby="blockReader" aria-label="Output panel">
                    <!-- Output lines will be appended here dynamically -->
                </div>
            </section>

            <!-- Code panel -->
            <div class="code-container">
                <div class="code-header">
                    <h2 id="codeHeader">Code</h2>
                    <label class="sr-only" for="languageSelect">Language</label>
                    <select id="languageSelect" class="program-dropdown program-dropdown--sm">
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="php">PHP</option>
                        <option value="lua">Lua</option>
                        <option value="dart">Dart</option>
                        <option value="xml">XML</option>
                    </select>
                </div>
                <pre id="codeOutput" class="prettyprint" style="border: none"><code class="language-javascript"></code></pre>
            </div>
        </div>
      </div>
    </main>
  </div>
  <script src="./js/tutorial-init.js"></script>
  <script type="module" src="./js/keyboard-trainer-init.js"></script>
  <script type="module" src="./js/app-menu.js"></script>
</body>
</html>
